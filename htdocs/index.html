<script>
  async function runReport(reportUrl) {
    const result = document.getElementById('report-result');
    result.textContent = `Running ${reportUrl} ...`;
    try {
      const res = await fetch('/ldp/db/reports', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: reportUrl, params: {}, limit: 100 }),
      });
      const text = await res.text();
      let body = text;
      try {
        body = JSON.stringify(JSON.parse(text), null, 2);
      } catch (e) {
        // Not JSON, e.g. an error message: show it as it is
      }
      result.textContent = `${reportUrl}\n${res.status} ${res.statusText}\n\n${body}`;
    } catch (e) {
      result.textContent = `${reportUrl}\nRequest failed: ${e}`;
    }
  }

  document.querySelectorAll('button.run-report').forEach(button => {
    button.addEventListener('click', () => runReport(button.dataset.url));
  });
</script>
